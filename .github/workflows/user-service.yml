name: User Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'user-service/**'
      - '.github/workflows/user-service.yml'

jobs:
  build-deploy:
    # Use your self-hosted runner
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'user-service/package-lock.json'

      - name: Install dependencies & run tests
        run: |
          cd user-service
          npm install
          npm test || echo "tests non implémentés"

      # Instead of using buildx action, use regular docker commands
      - name: Build Docker image
        run: |
          cd user-service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:latest .

      - name: Docker login
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/user-service:latest

      - name: Verify kubectl access
        run: kubectl get nodes

      - name: Deploy with Helm
        run: |
          helm upgrade --install user-service ./helm/user-service \
            --namespace default \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/user-service \
            --set image.tag=latest