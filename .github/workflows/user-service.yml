name: User Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'user-service/**'
      - '.github/workflows/user-service.yml'

jobs:
  build-deploy:
    # Use a self-hosted runner that can access your local network
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install dependencies & run tests
        run: |
          cd user-service
          npm install
          npm test || echo "tests non implémentés"

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./user-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/user-service:latest

      # The self-hosted runner can access your local Minikube directly
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Deploy to Kubernetes
        run: |
          # Use your local kubeconfig directly or configure it here
          export KUBECONFIG=$HOME/.kube/config
          
          # Deploy using Helm
          helm upgrade --install user-service ./helm/user-service \
            --namespace default \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/user-service \
            --set image.tag=latest